[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "abliteration"
version = "0.1.0"
description = "Activation feature ablation for TransformerLens models"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["torch>=2.0"]

[project.optional-dependencies]
transformer-lens = ["transformer-lens>=2.0"]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["abliteration*"]